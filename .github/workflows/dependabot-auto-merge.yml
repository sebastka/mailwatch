---
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0

      # Auto-merge non-major bumps (minor + patch, and base image digest refreshes) for GitHub
      # Actions, npm and the Dockerfile.
      # The merge still waits on the required "Check (tsc + eslint + prettier + tests) & build" status check, so
      # nothing lands unless `npm run check` passes. NB: fetch-metadata reports npm
      # as "npm_and_yarn" (Dependabot's internal name), not "npm".
      - name: Approve and enable auto-merge
        if: >-
          steps.meta.outputs.update-type != 'version-update:semver-major'
          && contains(fromJSON('["github_actions", "npm_and_yarn", "docker"]'), steps.meta.outputs.package-ecosystem)
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
