---
version: 2
# Pulling Docker Hardened Images needs a Docker Hub account. Dependabot cannot read Actions
# secrets or variables, so DHI_USERNAME and DHI_TOKEN are both Dependabot *secrets* here.
registries:
  dhi:
    type: docker-registry
    url: dhi.io
    username: ${{secrets.DHI_USERNAME}}
    password: ${{secrets.DHI_TOKEN}}

updates:
  # Keep SHA-pinned GitHub Actions up to date (bumps both the SHA and the # version comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    # One PR for all minor/patch action bumps. Separate PRs all edit release.yaml, and once
    # one merges the others are behind master: squash-merging a stale branch writes workflow
    # content the PR head doesn't have, which GITHUB_TOKEN may not do (no `workflows`
    # permission), so GitHub disables their auto-merge. Majors stay separate for review.
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]

  # npm dependencies (package.json + package-lock.json). Minor and patch bumps are
  # auto-merged by dependabot-auto-merge.yml once the check job passes; majors wait for review.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps

  # The digest-pinned runtime base image in the Dockerfile (dhi.io/node:26-alpine).
  - package-ecosystem: docker
    directory: /
    registries: [dhi]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
